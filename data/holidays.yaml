holidays:
  # Portugal
  - name: "Ano Novo"
    month: 1
    day: 1
    scene: "fireworks"
    phrases:
      - "Feliz ano novo do meio do oceano!"
      - "Mais um ano. A ilha não mudou."

  - name: "Carnaval"
    month: 2
    day: 13  # data variável — TODO: calcular dinamicamente
    scene: "party"
    phrases:
      - "Carnaval na ilha. Festa para um."

  - name: "Páscoa"
    month: 4
    day: 20  # data variável — TODO: calcular dinamicamente
    scene: "spring"
    phrases:
      - "Primavera. Novas esperanças, mesma ilha."

  - name: "Dia do Trabalhador"
    month: 5
    day: 1
    scene: "relax"
    phrases:
      - "Feriado do trabalho. Mas aqui é sempre feriado."

  - name: "Natal"
    month: 12
    day: 25
    scene: "christmas"
    phrases:
      - "Feliz Natal. Espero que alguém me encontre antes do próximo."
      - "Neve na ilha não seria mau. Mas não temos neve."

  - name: "Véspera de Natal"
    month: 12
    day: 24
    scene: "christmas_eve"
    phrases:
      - "Amanhã é Natal. Estou a fazer uma lista de desejos."

  - name: "Véspera de Ano Novo"
    month: 12
    day: 31
    scene: "fireworks_eve"
    phrases:
      - "Esta noite há fogos ao longe. Ou são relâmpagos."

# Estações do ano (hemisfério norte)
seasons:
  spring:  { start_month: 3,  start_day: 20 }
  summer:  { start_month: 6,  start_day: 21 }
  autumn:  { start_month: 9,  start_day: 22 }
  winter:  { start_month: 12, start_day: 21 }
